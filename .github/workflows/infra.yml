name: "Infrastructure DevSecOps (Terraform & Security)"

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - ".github/workflows/infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "environments/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:
    inputs:
      terraform_action:
        description: "Terraform lifecycle action (FinOps gated)"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

env:
  AWS_REGION: ap-southeast-1
  AWS_ACCOUNT_ID: "570515227299"

jobs:
  validate-and-lint:
    name: "Terraform Lint & Validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Check Terraform Formatting
        run: terraform fmt -check -recursive

      - name: Initialize Dev Environment (Local Validation)
        working-directory: environments/dev
        run: terraform init -backend=false

      - name: Validate Dev Environment
        working-directory: environments/dev
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Run TFLint
        run: |
          tflint --init
          tflint --recursive

  security-scan:
    name: "Checkov IaC Security Scan"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: terraform
          output_format: cli
          soft_fail: true

  terraform-lifecycle:
    name: "Terraform S3 Init & ${{ github.event.inputs.terraform_action }}"
    if: github.event_name == 'workflow_dispatch'
    needs: [validate-and-lint, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-eks-gitops-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Init (Remote S3 Backend)
        working-directory: environments/dev
        run: terraform init

      - name: Terraform Plan
        if: github.event.inputs.terraform_action == 'plan'
        working-directory: environments/dev
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event.inputs.terraform_action == 'apply'
        working-directory: environments/dev
        run: terraform apply -auto-approve -no-color

      - name: Terraform Destroy (FinOps Credit Protection)
        if: github.event.inputs.terraform_action == 'destroy'
        working-directory: environments/dev
        run: terraform destroy -auto-approve -no-color
