apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lead-capture-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: lead-capture-platform
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rjcloudev/aws-gitops-kubernetes.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

